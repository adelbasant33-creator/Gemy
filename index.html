<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ونس - هدية خاصة</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Arial', sans-serif; background: #000; }
        #video-bg { position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -1; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 1; }
        .login-box { background: rgba(255,255,255,0.1); padding: 30px; border-radius: 15px; backdrop-filter: blur(10px); text-align: center; color: white; border: 1px solid rgba(255,255,255,0.2); }
        input { padding: 12px; border-radius: 8px; border: none; margin-bottom: 15px; width: 200px; text-align: center; }
        button { padding: 10px 25px; border-radius: 8px; border: none; background: #e74c3c; color: white; cursor: pointer; font-weight: bold; }
        #content { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; z-index: 2; width: 80%; }
        h1 { font-size: 2.5rem; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <video autoplay muted loop id="video-bg">
        <source src="https://files.catbox.moe/ryy93x.mp4" type="video/mp4">
    </video>

    <audio id="bg-music" loop>
        <source src="https://files.catbox.moe/6ji1t0.mp3" type="audio/mpeg">
    </audio>

    <div class="overlay" id="login-screen">
        <div class="login-box">
            <h2>أهلاً بكِ في عالم ونس</h2>
            <p>أدخلي كلمة السر لرؤية المفاجأة</p>
            <input type="password" id="passInput" placeholder="كلمة السر...">
            <br>
            <button onclick="checkPass()">دخول</button>
        </div>
    </div>

    <div id="content">
        <h1>إنتي "ونس" العمر كله.. كل سنة وأنتي طيبة يا أغلى صدفة</h1>
        <p>اضغطي في أي مكان لتشغيل الموسيقى</p>
    </div>

    <script>
        function checkPass() {
            const pass = document.getElementById('passInput').value;
            if(pass === "ونس") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                const audio = document.getElementById('bg-music');
                audio.play().catch(e => console.log("Music needs interaction"));
            } else {
                alert("كلمة السر غلط يا بطلة، جربي تاني!");
            }
        }
        document.body.onclick = function() {
            document.getElementById('bg-music').play();
        }
    </script>
</body>
</html>
